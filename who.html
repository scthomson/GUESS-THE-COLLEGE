<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Who Played Here?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        #college {
            font-weight: bold;
            font-size: 24px;
        }

        input {
            padding: 10px;
            font-size: 18px;
            width: 250px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-left: 10px;
            cursor: pointer;
        }

        #feedback {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Who Played Here?</h1>

    <p>College: <span id="college"></span></p>

    <input id="guessInput" type="text" placeholder="Enter player name">
    <button onclick="checkGuess()">Submit Guess</button>

    <p id="feedback"></p>

    <script src="players.js"></script>

    <script>
        let currentPlayer;

        function loadNewPlayer() {
            const randomIndex = Math.floor(Math.random() * players.length);
            currentPlayer = players[randomIndex];
            document.getElementById("college").textContent = currentPlayer.college;
            document.getElementById("feedback").textContent = "";
        }

        function checkGuess() {
            const guess = document.getElementById("guessInput").value.trim().toLowerCase();
            const correct = currentPlayer.name.toLowerCase();
            const feedback = document.getElementById("feedback");

            if (guess === correct) {
                feedback.textContent = "Correct!";
                feedback.className = "correct";
            } else {
                feedback.textContent = "Incorrect!";
                feedback.className = "incorrect";
            }
        }

        window.onload = loadNewPlayer;
    </script>

</body>
</html>
