<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who Played Here?</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .college {
      font-size: 28px;
      margin-top: 30px;
      font-weight: 700;
    }

    input {
      margin-top: 20px;
      padding: 12px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      width: 260px;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #e63946;
      color: white;
      font-weight: 600;
    }

    .result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>Who Played Here?</h1>
    <p>Guess a player who went to this college</p>
  </header>

  <div class="college" id="collegeDisplay">Loading...</div>

  <input id="guessInput" placeholder="Enter player name" autocomplete="off" />

  <button onclick="checkGuess()">Submit Guess</button>

  <div class="result" id="result"></div>

  <!-- LOAD THE MEGA PLAYER LIST FIRST -->
  <script src="players.js"></script>

  <!-- GAME LOGIC -->
  <script>
    let currentCollege = "";
    let validPlayers = [];

    function pickCollege() {
      const randomPlayer = players[Math.floor(Math.random() * players.length)];
      currentCollege = randomPlayer.college;

      validPlayers = players
        .filter(p => p.college === currentCollege)
        .map(p => p.name.toLowerCase());

      document.getElementById("collegeDisplay").textContent = currentCollege;
    }

    function checkGuess() {
      const guess = document.getElementById("guessInput").value.toLowerCase().trim();

      if (validPlayers.includes(guess)) {
        document.getElementById("result").textContent = "Correct!";
      } else {
        document.getElementById("result").textContent = "Incorrect — try again.";
      }
    }

    pickCollege();
  </script>
</body>
</html>
