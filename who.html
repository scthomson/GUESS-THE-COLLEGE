<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who Played Here? – Ball Knowers</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-top: 20px;
    }

    .logo-main {
      font-size: 40px;
      font-weight: 900;
    }

    .logo-accent {
      width: 70px;
      height: 6px;
      background: #e63946;
      border-radius: 3px;
      margin: 10px auto;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .game-box {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 14px;
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .college {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      margin-top: 10px;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 14px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #e63946;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #b72d38;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 600;
    }

    .back {
      margin-top: 40px;
      opacity: 0.6;
      text-decoration: none;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-main">WHO PLAYED HERE?</div>
    <div class="logo-accent"></div>
    <p class="subtitle">Guess a player who attended this college</p>
  </header>

  <div class="game-box">
    <div id="college" class="college">Loading...</div>

    <input id="guessInput" type="text" placeholder="Enter a player name" />

    <button onclick="checkGuess()">Submit Guess</button>

    <div id="result" class="result"></div>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

  <script>
    // SAMPLE DATA — replace with your real list
    const players = [
      { name: "Devin Booker", college: "Kentucky" },
      { name: "Anthony Davis", college: "Kentucky" },
      { name: "Trae Young", college: "Oklahoma" },
      { name: "Jalen Hurts", college: "Oklahoma" },
      { name: "Joe Burrow", college: "LSU" },
      { name: "Justin Jefferson", college: "LSU" },
      { name: "Kyrie Irving", college: "Duke" },
      { name: "Zion Williamson", college: "Duke" }
    ];

    let currentCollege = "";

    function newRound() {
      const random = players[Math.floor(Math.random() * players.length)];
      currentCollege = random.college;
      document.getElementById("college").textContent = currentCollege;
      document.getElementById("result").textContent = "";
      document.getElementById("guessInput").value = "";
    }

    function checkGuess() {
      const guess = document.getElementById("guessInput").value.trim().toLowerCase();

      const match = players.find(
        p => p.college === currentCollege && p.name.toLowerCase() === guess
      );

      if (match) {
        document.getElementById("result").textContent = "Correct!";
        setTimeout(newRound, 1200);
      } else {
        document.getElementById("result").textContent = "Incorrect — try again";
      }
    }

    newRound();
  </script>

</body>
</html>
