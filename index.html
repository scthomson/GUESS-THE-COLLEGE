<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Knowers</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 0 20px;
      text-align: center;
    }

    /* LOGO */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-main {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo-accent {
      width: 80px;
      height: 6px;
      background: #e63946; /* red accent bar */
      border-radius: 3px;
      margin-top: 8px;
    }

    p.subtitle {
      font-size: 18px;
      opacity: 0.7;
      margin-top: 12px;
    }

    .modes {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 90%;
      max-width: 400px;
    }

    .mode-btn {
      padding: 18px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: 0.2s;
    }

    .nba {
      background: #17408B;
    }

    .nba:hover {
      background: #0f2d63;
    }

    .nfl {
      background: #013369;
    }

    .nfl:hover {
      background: #00264d;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      opacity: 0.5;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <span class="logo-main">BALL KNOWERS</span>
      <div class="logo-accent"></div>
    </div>
    <p class="subtitle">Test your sports knowledge</p>
  </header>

  <div class="modes">
    <a class="mode-btn nba" href="nba.html">NBA Mode</a>
    <a class="mode-btn nfl" href="nfl.html">NFL Mode</a>
  </div>

  <footer>
    © 2026 Ball Knowers
  </footer>
</body>
</html>
