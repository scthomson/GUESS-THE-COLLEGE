<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Mode - Ball Knowers</title>

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }

        /* HEADER */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo-main {
            font-size: 42px;
            font-weight: 900;
        }

        .logo-accent {
            width: 80px;
            height: 6px;
            background: #bfa76a;
            border-radius: 3px;
            margin-top: 8px;
            box-shadow: 0 0 12px rgba(191,167,106,0.4);
        }

        h2 {
            font-size: 22px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* MAIN BOX */
        .career-box {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 600px;
            margin: 30px auto;
            font-size: 22px;
            line-height: 1.6;
            border: 1px solid #8c7846;
            box-shadow: 0 0 20px rgba(191,167,106,0.25);
            transition: 0.3s;
        }

        /* INPUT */
        input {
            padding: 14px;
            width: 70%;
            max-width: 400px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #8c7846;
            background: #111;
            color: white;
            margin-top: 20px;
        }

        /* BUTTONS */
        .btn {
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin: 10px;
            transition: 0.2s;
        }

        .gold-btn {
            background: linear-gradient(135deg, #bfa76a, #8c7846);
            color: black;
            box-shadow: 0 0 12px rgba(191,167,106,0.35);
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #d8c48a, #bfa76a);
            box-shadow: 0 0 20px rgba(191,167,106,0.5);
            transform: scale(1.05);
        }

        /* DIFFICULTY SELECTOR */
        .difficulty {
            margin-top: 20px;
        }

        .difficulty button {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        .difficulty button.active {
            background: #bfa76a;
            color: black;
            border-color: #8c7846;
            box-shadow: 0 0 10px rgba(191,167,106,0.4);
        }

        /* RESULT TEXT */
        .result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .correct {
            color: #bfa76a;
            text-shadow: 0 0 10px rgba(191,167,106,0.4);
        }

        .wrong {
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255,77,77,0.4);
        }

        a.back {
            color: #bfa76a;
            text-decoration: none;
            font-size: 18px;
        }

        a.back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="logo">
        <span class="logo-main">Career Path Mode</span>
        <div class="logo-accent"></div>
    </div>

    <h2>Guess the player from their career journey</h2>
    <a class="back" href="index.html">← Back to Home</a>

    <div class="difficulty">
        <button class="btn" onclick="setDifficulty('easy')" id="easyBtn">Easy</button>
        <button class="btn" onclick="setDifficulty('medium')" id="mediumBtn">Medium</button>
        <button class="btn" onclick="setDifficulty('hard')" id="hardBtn">Hard</button>
    </div>

    <div class="career-box" id="careerDisplay">Loading...</div>

    <input id="guessInput" placeholder="Enter player name...">
    <br>
    <button class="btn gold-btn" onclick="checkGuess()">Submit Guess</button>
    <button class="btn gold-btn" onclick="newPlayer()">New Player</button>

    <div class="result" id="resultText"></div>

    <script>
        /* SAMPLE DATA — replace with real database later */
        const players = [
            {
                name: "Kevin Durant",
                teams: ["Seattle SuperSonics", "Oklahoma City Thunder", "Golden State Warriors", "Brooklyn Nets", "Phoenix Suns"]
            },
            {
                name: "Tom Brady",
                teams: ["New England Patriots", "Tampa Bay Buccaneers"]
            },
            {
                name: "Chris Paul",
                teams: ["New Orleans Hornets", "Los Angeles Clippers", "Houston Rockets", "Oklahoma City Thunder", "Phoenix Suns", "Golden State Warriors"]
            }
        ];

        let currentPlayer = null;
        let difficulty = "easy";

        function setDifficulty(level) {
            difficulty = level;

            document.getElementById("easyBtn").classList.remove("active");
            document.getElementById("mediumBtn").classList.remove("active");
            document.getElementById("hardBtn").classList.remove("active");

            document.getElementById(level + "Btn").classList.add("active");

            newPlayer();
        }

        function newPlayer() {
            currentPlayer = players[Math.floor(Math.random() * players.length)];

            let teams = [...currentPlayer.teams];

            if (difficulty === "medium" && teams.length > 2) {
                teams = [teams[0], "...", teams[teams.length - 1]];
            }

            if (difficulty === "hard") {
                teams = ["???", "???", "???"];
            }

            document.getElementById("careerDisplay").innerHTML = teams.join(" → ");
            document.getElementById("resultText").innerHTML = "";
            document.getElementById("guessInput").value = "";
        }

        function checkGuess() {
            const guess = document.getElementById("guessInput").value.trim().toLowerCase();
            const correct = currentPlayer.name.toLowerCase();

            if (guess === correct) {
                document.getElementById("resultText").innerHTML =
                    `<span class="correct">Correct! It was ${currentPlayer.name}.</span>`;
            } else {
                document.getElementById("resultText").innerHTML =
                    `<span class="wrong">Incorrect. It was ${currentPlayer.name}.</span>`;
            }
        }

        setDifficulty("easy");
    </script>

</body>
</html>
