    color: gold;
    margin-bottom: 10px;
  }

  .date-label {
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .crossword {
    display: grid;
    grid-template-columns: repeat(5, 50px);
    grid-template-rows: repeat(5, 50px);
    gap: 3px;
    margin: 20px auto;
  }

  .cell {
    width: 50px;
    height: 50px;

    border: 2px solid #444;
    font-size: 28px;
    text-transform: uppercase;
    text-align: center;
    line-height: 50px;
    cursor: text;
  }

  .cell:focus {
    outline: 2px solid gold;
  }

  .block {
    background: black;
    border: 2px solid #000;
  }

  .clues {
    margin-top: 30px;
    text-align: left;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }

  .clues h2 {
    color: gold;
    margin-bottom: 10px;
  }

  .check-btn {
    margin-top: 25px;
    padding: 12px 20px;
    background: gold;
    color: black;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }

  .check-btn:hover {
    background: #e6c200;
  }
</style>
</head>

const index = dayOfYear() % puzzles.length;
const puzzle = puzzles[index];

const grid = document.getElementById("grid");
const clueBox = document.getElementById("clueBox");

// Build grid
puzzle.layout.forEach(char => {
  const cell = document.createElement("input");

  if (char === "#") {
    cell.className = "cell block";
    cell.disabled = true;
  } else {
    cell.className = "cell";
    cell.maxLength = 1;
    cell.dataset.answer = char;
  }

  grid.appendChild(cell);
});

// Load clues
clueBox.innerHTML = `
  <h2>Across</h2>
  ${puzzle.across.map(c => `<p>${c}</p>`).join("")}
  <h2>Down</h2>
  ${puzzle.down.map(c => `<p>${c}</p>`).join("")}
`;

// Check correctness
function checkPuzzle() {
  const cells = document.querySelectorAll(".cell");

  cells.forEach(cell => {
    if (cell.classList.contains("block")) return;

    const correct = cell.dataset.answer;
    const guess = cell.value.toUpperCase();

    if (guess === correct) {
      cell.style.background = "#1e3d1e";
      cell.style.borderColor = "lime";
    } else {
      cell.style.background = "#3d1e1e";
      cell.style.borderColor = "red";
    }
  });
}
